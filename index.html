<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timestamp Generator</title>
<style>
  :root{
    --bg:#101014;
    --panel:#17171d;
    --panel-2:#1f1f27;
    --accent:#f5c518;
    --accent-dim:#a88a11;
    --text:#e7e7ea;
    --text-dim:#83838f;
    --border:#2c2c36;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  header{padding:18px 22px;border-bottom:1px solid var(--border);}
  header h1{margin:0;font-size:16px;letter-spacing:.5px;font-weight:600;}
  header h1 span{color:var(--accent);}
  header p{margin:3px 0 0;font-size:12px;color:var(--text-dim);}

  .layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 66px);}
  @media(max-width:860px){.layout{grid-template-columns:1fr;}}

  .panel{
    background:var(--panel);padding:20px;border-right:1px solid var(--border);
    display:flex;flex-direction:column;gap:16px;
  }
  .field label{
    display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--accent-dim);margin-bottom:7px;font-weight:600;
  }
  .drop{
    border:1.5px dashed var(--border);background:var(--panel-2);
    padding:22px 12px;text-align:center;cursor:pointer;border-radius:8px;
    font-size:13px;color:var(--text-dim);transition:.15s;
  }
  .drop:hover,.drop.drag{border-color:var(--accent);color:var(--accent);}
  input[type=file]{display:none;}

  .seg{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  .seg button{
    flex:1;background:var(--panel-2);color:var(--text-dim);border:none;
    padding:9px 6px;font:inherit;font-size:12px;cursor:pointer;
  }
  .seg button.active{background:var(--accent);color:#1a1500;font-weight:600;}

  input[type=date],input[type=time],textarea,select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);font:inherit;font-size:13px;padding:9px;border-radius:6px;
  }
  textarea{resize:vertical;min-height:60px;line-height:1.4;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  input[type=color]{
    width:100%;height:36px;background:var(--panel-2);
    border:1px solid var(--border);border-radius:6px;padding:2px;cursor:pointer;
  }
  .row{display:flex;gap:9px;}
  .row>div{flex:1;}
  .hint{font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.4;}

  .btn{
    background:var(--accent);color:#1a1500;border:none;padding:12px;
    font:inherit;font-weight:700;font-size:13px;border-radius:7px;cursor:pointer;
  }
  .btn:disabled{background:var(--panel-2);color:var(--text-dim);cursor:not-allowed;}
  .btn:hover:not(:disabled){filter:brightness(1.08);}

  .stage{
    display:flex;align-items:center;justify-content:center;padding:28px;
    background:repeating-conic-gradient(#15151a 0% 25%,#131318 0% 50%) 50%/22px 22px;
  }
  .canvas-wrap{max-width:100%;box-shadow:0 18px 50px rgba(0,0,0,.55);}
  canvas{display:block;max-width:100%;max-height:75vh;height:auto;background:#000;}
  .placeholder{color:var(--text-dim);font-size:13px;}
</style>
</head>
<body>

<header>
  <h1>Timestamp <span>Generator</span></h1>
  <p>Tempel jam, tanggal, dan lokasi ke foto</p>
</header>

<div class="layout">
  <div class="panel">

    <div class="field">
      <label>Foto</label>
      <div class="drop" id="dropZone">Klik atau drag foto ke sini<div class="hint">JPG / PNG</div></div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="field">
      <label>Sumber Waktu</label>
      <div class="seg">
        <button id="modeExif" class="active">EXIF Foto</button>
        <button id="modeManual">Manual</button>
      </div>
      <div class="hint" id="exifStatus">Upload foto dulu untuk baca EXIF.</div>
    </div>

    <div class="field">
      <label>Tanggal &amp; Jam</label>
      <div class="row">
        <div><input type="date" id="dateInput"></div>
        <div><input type="time" id="timeInput"></div>
      </div>
    </div>

    <div class="field">
      <label>Bahasa Tanggal</label>
      <select id="langInput">
        <option value="en">English — Mon, 31 Aug 2026</option>
        <option value="id">Indonesia — Sen, 31 Agu 2026</option>
      </select>
    </div>

    <div class="field">
      <label>Alamat / Lokasi</label>
      <textarea id="addrInput" placeholder="RT.7/RW.1, Cipayung, East Jakarta City, Jakarta 13840"></textarea>
      <div class="hint">Otomatis wrap ke baris baru kalau kepanjangan.</div>
    </div>

    <div class="field">
      <label>Ukuran Overlay</label>
      <input type="range" id="scaleInput" min="60" max="160" value="100">
    </div>

    <div class="field">
      <label>Warna Garis Pembatas</label>
      <input type="color" id="accentInput" value="#f5c518">
    </div>

    <button class="btn" id="downloadBtn" disabled>Download Hasil</button>
  </div>

  <div class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="placeholder">Belum ada foto</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fileInput=$('fileInput'), dropZone=$('dropZone'), canvasWrap=$('canvasWrap');
const modeExifBtn=$('modeExif'), modeManualBtn=$('modeManual'), exifStatus=$('exifStatus');
const dateInput=$('dateInput'), timeInput=$('timeInput'), langInput=$('langInput');
const addrInput=$('addrInput'), scaleInput=$('scaleInput'), accentInput=$('accentInput');
const downloadBtn=$('downloadBtn');

let img=null, canvas=null, ctx=null, mode='exif', exifDate=null;

const DAYS = {
  en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
  id:['Min','Sen','Sel','Rab','Kam','Jum','Sab']
};
const MONTHS = {
  en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  id:['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']
};

/* ---------- EXIF parser (JPEG APP1) ---------- */
function readIFD(view, tiff, ifd, little){
  const out={};
  const n=view.getUint16(ifd, little);
  for(let i=0;i<n;i++){
    const e=ifd+2+i*12;
    const tag=view.getUint16(e,little), type=view.getUint16(e+2,little), count=view.getUint32(e+4,little);
    if(type===2 && count>0){
      const off = count<=4 ? e+8 : tiff+view.getUint32(e+8,little);
      let s='';
      for(let j=0;j<count-1;j++) s+=String.fromCharCode(view.getUint8(off+j));
      out[tag]=s;
    } else if(type===4 && count===1){
      out[tag]=view.getUint32(e+8,little);
    }
  }
  return out;
}
function parseExifDate(buffer){
  try{
    const view=new DataView(buffer);
    if(view.getUint16(0,false)!==0xFFD8) return null;
    let offset=2;
    while(offset<view.byteLength-1){
      if(view.getUint8(offset)!==0xFF) break;
      const marker=view.getUint8(offset+1);
      if(marker===0xE1){
        const start=offset+4;
        let sig='';
        for(let i=0;i<4;i++) sig+=String.fromCharCode(view.getUint8(start+i));
        if(sig!=='Exif') return null;
        const tiff=start+6;
        const little=view.getUint16(tiff,false)===0x4949;
        const ifd0=readIFD(view,tiff,tiff+view.getUint32(tiff+4,little),little);
        if(ifd0[0x8769]){
          const sub=readIFD(view,tiff,tiff+ifd0[0x8769],little);
          return sub[0x9003]||sub[0x9004]||null;
        }
        return ifd0[0x0132]||null;
      }
      offset += (marker>=0xD0 && marker<=0xD9) ? 2 : 2+view.getUint16(offset+2,false);
    }
  }catch(e){}
  return null;
}

/* ---------- File handling ---------- */
dropZone.onclick = () => fileInput.click();
dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('drag'); };
dropZone.ondragleave = () => dropZone.classList.remove('drag');
dropZone.ondrop = e => {
  e.preventDefault(); dropZone.classList.remove('drag');
  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
};
fileInput.onchange = e => { if(e.target.files.length) handleFile(e.target.files[0]); };

function handleFile(file){
  if(!file.type.startsWith('image/')) return;
  const reader=new FileReader();
  reader.onload = e => {
    const buf = e.target.result;
    const raw = parseExifDate(buf.slice(0));
    exifDate = null;

    if(raw){
      const m = raw.match(/(\d{4}):(\d{2}):(\d{2})\s(\d{2}):(\d{2})/);
      if(m){
        exifDate = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
        exifStatus.textContent = 'EXIF ditemukan: ' + raw;
        dateInput.value = `${m[1]}-${m[2]}-${m[3]}`;
        timeInput.value = `${m[4]}:${m[5]}`;
      }
    }
    if(!exifDate){
      exifStatus.textContent = 'EXIF tidak ada di foto ini — pakai mode Manual.';
      const now=new Date();
      if(!dateInput.value) dateInput.value = now.toISOString().slice(0,10);
      if(!timeInput.value) timeInput.value = now.toTimeString().slice(0,5);
      mode='manual'; setMode();
    }

    const url = URL.createObjectURL(new Blob([buf]));
    const image = new Image();
    image.onload = () => { img=image; setupCanvas(); draw(); URL.revokeObjectURL(url); };
    image.src = url;
  };
  reader.readAsArrayBuffer(file);
}

function setupCanvas(){
  canvasWrap.innerHTML='';
  canvas=document.createElement('canvas');
  canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
  ctx=canvas.getContext('2d');
  canvasWrap.appendChild(canvas);
  downloadBtn.disabled=false;
}

function currentDate(){
  if(mode==='exif' && exifDate) return exifDate;
  if(!dateInput.value) return null;
  const [y,mo,d]=dateInput.value.split('-').map(Number);
  const [h,mi]=(timeInput.value||'00:00').split(':').map(Number);
  return new Date(y,mo-1,d,h,mi);
}

function wrapText(ctx, text, maxWidth){
  const words=text.split(' '), lines=[];
  let line='';
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line=w; }
    else line=test;
  }
  if(line) lines.push(line);
  return lines;
}

/* ---------- Draw overlay ---------- */
function draw(){
  if(!img||!ctx) return;
  ctx.drawImage(img,0,0,canvas.width,canvas.height);

  const d = currentDate();
  if(!d) return;

  const lang = langInput.value;
  const scale = (scaleInput.value/100) * (canvas.width/1200);
  const accent = accentInput.value;

  const pad     = 40*scale;
  const timeF   = 92*scale;   // jam besar
  const dateF   = 34*scale;
  const addrF   = 33*scale;
  const gap     = 14*scale;

  const timeStr = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const dateStr = `${d.getDate()} ${MONTHS[lang][d.getMonth()]} ${d.getFullYear()}`;
  const dayStr  = DAYS[lang][d.getDay()];
  const addr    = addrInput.value.trim();

  // ukur tinggi blok alamat
  ctx.font = `500 ${addrF}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  const addrLines = addr ? wrapText(ctx, addr, canvas.width - pad*2) : [];
  const addrLineH = addrF*1.28;

  const timeBlockH = timeF*1.05;
  const addrBlockH = addrLines.length ? addrLines.length*addrLineH + gap : 0;
  const rulePad    = gap*1.4;
  const blockH     = timeBlockH + addrBlockH + rulePad + pad;

  // scrim gelap biar teks kebaca
  const scrimTop = canvas.height - blockH - pad*0.8;
  const grad = ctx.createLinearGradient(0, scrimTop, 0, canvas.height);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, scrimTop, canvas.width, canvas.height - scrimTop);

  ctx.textAlign='left';
  ctx.shadowColor='rgba(0,0,0,0.55)';
  ctx.shadowBlur=6*scale;

  let y = canvas.height - pad;

  // garis pembatas horizontal (paling bawah)
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,0.45)';
  ctx.lineWidth=Math.max(1, 1.6*scale);
  ctx.beginPath();
  ctx.moveTo(pad, y);
  ctx.lineTo(canvas.width - pad, y);
  ctx.stroke();
  ctx.shadowColor='rgba(0,0,0,0.55)';
  ctx.shadowBlur=6*scale;

  y -= rulePad;

  // alamat (dari bawah ke atas)
  if(addrLines.length){
    ctx.font = `500 ${addrF}px -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.fillStyle='#ffffff';
    ctx.textBaseline='alphabetic';
    for(let i=addrLines.length-1;i>=0;i--){
      ctx.fillText(addrLines[i], pad, y);
      y -= addrLineH;
    }
    y -= gap*0.3;
  }

  // jam besar
  ctx.font = `700 ${timeF}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.textBaseline='alphabetic';
  ctx.fillStyle='#ffffff';
  const timeBaseline = y;
  ctx.fillText(timeStr, pad, timeBaseline);
  const timeW = ctx.measureText(timeStr).width;

  // garis pembatas vertikal
  const dividerX = pad + timeW + gap*1.6;
  const divTop = timeBaseline - timeF*0.80;
  const divBot = timeBaseline + timeF*0.06;
  ctx.shadowBlur=0;
  ctx.strokeStyle=accent;
  ctx.lineWidth=Math.max(2, 5*scale);
  ctx.beginPath();
  ctx.moveTo(dividerX, divTop);
  ctx.lineTo(dividerX, divBot);
  ctx.stroke();
  ctx.shadowColor='rgba(0,0,0,0.55)';
  ctx.shadowBlur=6*scale;

  // tanggal + hari di kanan divider
  const textX = dividerX + gap*1.5;
  ctx.font = `500 ${dateF}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.fillStyle='#ffffff';
  ctx.fillText(dateStr, textX, divTop + dateF*0.95);
  ctx.fillText(dayStr,  textX, divBot - dateF*0.15);

  ctx.shadowColor='transparent';
  ctx.shadowBlur=0;
}

/* ---------- Mode toggle ---------- */
function setMode(){
  modeExifBtn.classList.toggle('active', mode==='exif');
  modeManualBtn.classList.toggle('active', mode==='manual');
  draw();
}
modeExifBtn.onclick = () => { mode='exif'; setMode(); };
modeManualBtn.onclick = () => { mode='manual'; setMode(); };

[dateInput,timeInput,langInput,addrInput,scaleInput,accentInput].forEach(el=>{
  el.addEventListener('input', () => { if(el!==langInput) mode='manual'===mode?mode:mode; draw(); });
});
dateInput.addEventListener('input', ()=>{ mode='manual'; setMode(); });
timeInput.addEventListener('input', ()=>{ mode='manual'; setMode(); });

/* ---------- Download ---------- */
downloadBtn.onclick = () => {
  const a=document.createElement('a');
  a.download='timestamp-'+Date.now()+'.jpg';
  a.href=canvas.toDataURL('image/jpeg',0.95);
  a.click();
};
</script>
</body>
</html>
