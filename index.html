<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timestamp Overlay</title>
<style>
  :root{
    --bg: #14140f;
    --panel: #1c1c16;
    --panel-2: #232319;
    --amber: #ffb000;
    --amber-dim: #b87f00;
    --text: #e8e3d3;
    --text-dim: #8a8578;
    --border: #333026;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Courier New', monospace;
    min-height:100vh;
  }
  header{
    padding:20px 24px 16px;
    border-bottom:1px solid var(--border);
  }
  header .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  header .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px var(--amber);
  }
  header h1{
    font-size:18px;
    letter-spacing:3px;
    margin:0;
    font-weight:700;
    text-transform:uppercase;
  }
  header p{
    margin:4px 0 0 20px;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:1px;
  }
  .layout{
    display:grid;
    grid-template-columns: 320px 1fr;
    gap:0;
    min-height:calc(100vh - 78px);
  }
  @media (max-width: 800px){
    .layout{grid-template-columns:1fr;}
  }
  .panel{
    background:var(--panel);
    padding:20px;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:2px;
    color:var(--amber-dim);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .drop{
    border:1px dashed var(--border);
    background:var(--panel-2);
    padding:24px 12px;
    text-align:center;
    cursor:pointer;
    font-size:12px;
    color:var(--text-dim);
    transition: border-color .15s ease, color .15s ease;
  }
  .drop:hover, .drop.drag{
    border-color:var(--amber);
    color:var(--amber);
  }
  input[type=file]{display:none;}
  .seg{
    display:flex;
    border:1px solid var(--border);
    overflow:hidden;
  }
  .seg button{
    flex:1;
    background:var(--panel-2);
    color:var(--text-dim);
    border:none;
    padding:10px 6px;
    font-family:inherit;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .seg button.active{
    background:var(--amber);
    color:#1a1204;
    font-weight:700;
  }
  input[type=date], input[type=time], input[type=range]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:inherit;
    padding:8px;
    font-size:13px;
  }
  input[type=color]{
    width:100%;
    height:38px;
    background:var(--panel-2);
    border:1px solid var(--border);
    padding:2px;
    cursor:pointer;
  }
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  .hint{font-size:11px;color:var(--text-dim);margin-top:6px;}
  .status{
    font-size:11px;
    padding:8px 10px;
    border-left:2px solid var(--amber);
    background:var(--panel-2);
    color:var(--text-dim);
    display:none;
  }
  .status.show{display:block;}
  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    background:
      repeating-conic-gradient(#1a1a14 0% 25%, #171712 0% 50%) 50% / 24px 24px;
  }
  .canvas-wrap{
    max-width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  canvas{
    display:block;
    max-width:100%;
    height:auto;
    background:#000;
  }
  .placeholder{
    color:var(--text-dim);
    font-size:13px;
    text-align:center;
    letter-spacing:1px;
  }
  .btn{
    background:var(--amber);
    color:#1a1204;
    border:none;
    padding:12px;
    font-family:inherit;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:12px;
    cursor:pointer;
  }
  .btn:disabled{
    background:var(--panel-2);
    color:var(--text-dim);
    cursor:not-allowed;
  }
  .btn:hover:not(:disabled){filter:brightness(1.1);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>Timestamp Overlay</h1>
  </div>
  <p>tempel tanggal &amp; jam ke foto — gaya digital camera</p>
</header>

<div class="layout">
  <div class="panel">

    <div class="field">
      <label>01 — Upload Foto</label>
      <div class="drop" id="dropZone">
        Klik atau drag foto ke sini<br>
        <span class="hint">JPG / PNG</span>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="field">
      <label>02 — Sumber Timestamp</label>
      <div class="seg">
        <button id="modeExif" class="active">EXIF Foto</button>
        <button id="modeManual">Manual</button>
      </div>
      <div class="hint" id="exifStatus">Upload foto dulu untuk baca EXIF.</div>
    </div>

    <div class="field" id="manualFields" style="display:none;">
      <label>03 — Tanggal &amp; Jam</label>
      <div class="row">
        <div><input type="date" id="dateInput"></div>
        <div><input type="time" id="timeInput" step="1"></div>
      </div>
    </div>

    <div class="field">
      <label>Ukuran Teks</label>
      <input type="range" id="sizeInput" min="12" max="72" value="28">
    </div>

    <div class="field">
      <label>Warna Teks</label>
      <input type="color" id="colorInput" value="#ffb000">
    </div>

    <div class="status" id="statusBox"></div>

    <button class="btn" id="downloadBtn" disabled>Download Hasil</button>
  </div>

  <div class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="placeholder">belum ada foto</div>
    </div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const canvasWrap = document.getElementById('canvasWrap');
const modeExifBtn = document.getElementById('modeExif');
const modeManualBtn = document.getElementById('modeManual');
const manualFields = document.getElementById('manualFields');
const exifStatus = document.getElementById('exifStatus');
const dateInput = document.getElementById('dateInput');
const timeInput = document.getElementById('timeInput');
const sizeInput = document.getElementById('sizeInput');
const colorInput = document.getElementById('colorInput');
const downloadBtn = document.getElementById('downloadBtn');
const statusBox = document.getElementById('statusBox');

let img = null;
let canvas = null;
let ctx = null;
let mode = 'exif'; // 'exif' | 'manual'
let exifDateStr = null; // formatted string already, or null

function showStatus(msg){
  statusBox.textContent = msg;
  statusBox.classList.add('show');
}

// ---------- EXIF PARSER (manual, JPEG only) ----------
function getStringFromDataView(view, start, length){
  let str = '';
  for (let i = 0; i < length; i++) str += String.fromCharCode(view.getUint8(start + i));
  return str;
}

function readIFD(view, tiffOffset, ifdOffset, little){
  const result = {};
  const numEntries = view.getUint16(ifdOffset, little);
  for (let i = 0; i < numEntries; i++){
    const entryOffset = ifdOffset + 2 + i * 12;
    const tag = view.getUint16(entryOffset, little);
    const type = view.getUint16(entryOffset + 2, little);
    const count = view.getUint32(entryOffset + 4, little);
    if (type === 2 && count > 0){ // ASCII
      let valueOffset;
      if (count <= 4){
        valueOffset = entryOffset + 8;
      } else {
        valueOffset = tiffOffset + view.getUint32(entryOffset + 8, little);
      }
      let str = '';
      for (let j = 0; j < count - 1; j++){
        str += String.fromCharCode(view.getUint8(valueOffset + j));
      }
      result[tag] = str;
    } else if (type === 4 && count === 1){ // LONG, used for IFD pointers
      result[tag] = view.getUint32(entryOffset + 8, little);
    }
  }
  return result;
}

function parseExifDateFromArrayBuffer(buffer){
  try {
    const view = new DataView(buffer);
    if (view.getUint16(0, false) !== 0xFFD8) return null; // not a JPEG
    let offset = 2;
    const length = view.byteLength;
    while (offset < length - 1){
      if (view.getUint8(offset) !== 0xFF) break;
      const marker = view.getUint8(offset + 1);
      if (marker === 0xE1){
        const start = offset + 4;
        if (getStringFromDataView(view, start, 4) !== 'Exif') return null;
        const tiffOffset = start + 6;
        const little = view.getUint16(tiffOffset, false) === 0x4949;
        const firstIFDOffset = view.getUint32(tiffOffset + 4, little);
        const ifd0 = readIFD(view, tiffOffset, tiffOffset + firstIFDOffset, little);
        let dateStr = null;
        if (ifd0[0x8769]){
          const exifIFD = readIFD(view, tiffOffset, tiffOffset + ifd0[0x8769], little);
          dateStr = exifIFD[0x9003] || exifIFD[0x9004] || null;
        }
        if (!dateStr) dateStr = ifd0[0x0132] || null;
        return dateStr; // format "YYYY:MM:DD HH:MM:SS"
      } else if (marker === 0xD8 || (marker >= 0xD0 && marker <= 0xD9)){
        offset += 2;
      } else {
        offset += 2 + view.getUint16(offset + 2, false);
      }
    }
  } catch(e){ /* fall through */ }
  return null;
}

function formatExifString(raw){
  // raw: "YYYY:MM:DD HH:MM:SS" -> "DD/MM/YYYY HH:MM:SS"
  const m = raw.match(/(\d{4}):(\d{2}):(\d{2})\s(\d{2}):(\d{2}):(\d{2})/);
  if (!m) return raw;
  const [, y, mo, d, h, mi, s] = m;
  return `${d}/${mo}/${y} ${h}:${mi}:${s}`;
}

// ---------- FILE HANDLING ----------
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function handleFile(file){
  if (!file.type.startsWith('image/')) return;

  const reader = new FileReader();
  reader.onload = function(e){
    const arrayBuffer = e.target.result;
    const raw = parseExifDateFromArrayBuffer(arrayBuffer.slice(0));
    exifDateStr = raw ? formatExifString(raw) : null;

    if (exifDateStr){
      exifStatus.textContent = `EXIF ditemukan: ${exifDateStr}`;
    } else {
      exifStatus.textContent = 'EXIF tidak ditemukan di foto ini — pakai mode Manual.';
    }

    const blob = new Blob([arrayBuffer]);
    const url = URL.createObjectURL(blob);
    const image = new Image();
    image.onload = function(){
      img = image;
      setupCanvas();
      draw();
      URL.revokeObjectURL(url);
    };
    image.src = url;
  };
  reader.readAsArrayBuffer(file);

  // set default manual date to now
  const now = new Date();
  dateInput.value = now.toISOString().slice(0,10);
  timeInput.value = now.toTimeString().slice(0,8);
}

function setupCanvas(){
  canvasWrap.innerHTML = '';
  canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  ctx = canvas.getContext('2d');
  canvasWrap.appendChild(canvas);
  downloadBtn.disabled = false;
}

function getTimestampText(){
  if (mode === 'exif' && exifDateStr){
    return exifDateStr;
  }
  // manual (or exif fallback)
  const d = dateInput.value;
  const t = timeInput.value || '00:00:00';
  if (!d) return '';
  const [y, mo, da] = d.split('-');
  return `${da}/${mo}/${y} ${t}`;
}

function draw(){
  if (!img || !ctx) return;
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  const text = getTimestampText();
  if (!text) return;

  const fontSize = Math.max(12, parseInt(sizeInput.value, 10)) * (canvas.width / 900);
  const color = colorInput.value;
  const padding = fontSize * 0.7;

  ctx.font = `700 ${fontSize}px 'Courier New', monospace`;
  ctx.textBaseline = 'bottom';
  ctx.textAlign = 'right';
  ctx.shadowColor = 'rgba(0,0,0,0.75)';
  ctx.shadowBlur = fontSize * 0.25;
  ctx.shadowOffsetX = 1;
  ctx.shadowOffsetY = 1;
  ctx.fillStyle = color;
  ctx.fillText(text, canvas.width - padding, canvas.height - padding);

  ctx.shadowColor = 'transparent';
}

// ---------- MODE TOGGLE ----------
modeExifBtn.addEventListener('click', () => {
  mode = 'exif';
  modeExifBtn.classList.add('active');
  modeManualBtn.classList.remove('active');
  manualFields.style.display = 'none';
  draw();
});
modeManualBtn.addEventListener('click', () => {
  mode = 'manual';
  modeManualBtn.classList.add('active');
  modeExifBtn.classList.remove('active');
  manualFields.style.display = 'block';
  draw();
});

[dateInput, timeInput, sizeInput, colorInput].forEach(el => {
  el.addEventListener('input', draw);
});

// ---------- DOWNLOAD ----------
downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'timestamp-overlay.jpg';
  link.href = canvas.toDataURL('image/jpeg', 0.95);
  link.click();
});
</script>

</body>
</html>
